<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="assets/css/global.css">
<link rel="stylesheet" href="assets/css/components.css">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="icon" media="(prefers-color-scheme: light)" href="{{ r.faviconLight }}">
<link rel="icon" media="(prefers-color-scheme: dark)" href="{{ r.faviconDark }}">
<link rel="apple-touch-icon" href="{{ r.webclip }}">
<style>body{margin:0;font-family:var(--font-sans);-webkit-font-smoothing:antialiased}a{color:var(--color-primary);text-decoration:none}a:hover{color:var(--color-primary-hover)}*{box-sizing:border-box}</style>
</helmet>
<nav class="rs-nav" style="position:fixed;top:0;left:0;right:0;width:100%;z-index:9999;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px clamp(16px,4vw,40px);background:rgba(246,243,236,.86);backdrop-filter:blur(12px);border-bottom:1px solid rgba(30,28,25,.06);font-family:var(--font-sans)">
  <a href="{{ r.home }}" aria-label="Interfluent home" style="display:flex;align-items:center;color:var(--color-text)">
    <img src="{{ r.logo }}" alt="Interfluent" style="display:block;width:158px;max-width:42vw;height:auto">
  </a>
  <label class="rs-burger" aria-label="Menu"><input type="checkbox"><i></i></label>
  <div class="rs-navlinks" style="display:flex;align-items:center;gap:28px;font-size:14px;font-weight:500;flex-wrap:wrap;justify-content:flex-end">
    <a href="{{ r.product }}" style="color:var(--color-text-soft)">Product</a>
    <a href="{{ r.pricing }}" style="color:{{ c.pricing }}">Pricing</a>
    <a href="{{ r.about }}" style="color:{{ c.about }}">About us</a>
    <a href="{{ r.blog }}" style="color:{{ c.blog }}">Blog</a>
    <a href="{{ r.careers }}" style="color:{{ c.careers }}">Careers</a>
    <a href="{{ r.contact }}" style="color:{{ c.contact }}">Contact</a>
    <sc-if value="{{ showSignIn }}" hint-placeholder-val="{{ true }}"><a href="{{ r.signin }}" style="color:var(--color-primary);font-weight:600">Sign in</a></sc-if>
    <sc-if value="{{ showBeta }}" hint-placeholder-val="{{ true }}"><a href="{{ r.beta }}" style="background:var(--color-primary);color:var(--color-bg);padding:10px 16px;border-radius:999px;font-weight:600" style-hover="background:var(--color-primary-hover)">Request beta access</a></sc-if>
    <sc-if value="{{ showWalk }}" hint-placeholder-val="{{ false }}"><a href="{{ r.contact }}" style="background:var(--color-primary);color:var(--color-bg);padding:10px 16px;border-radius:999px;font-weight:600" style-hover="background:var(--color-primary-hover)">Book a walkthrough</a></sc-if>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;pricing&quot;,&quot;about&quot;,&quot;blog&quot;,&quot;careers&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;betaEnabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;accessCodeEnabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const cfg = window.CODELENS_CONFIG || {};
    const beta = this.props.betaEnabled ?? cfg.betaEnabled ?? true;
    const code = this.props.accessCodeEnabled ?? cfg.accessCodeEnabled ?? true;
    const active = this.props.active || '';
    const isProjectPages = location.hostname.endsWith('github.io') && location.pathname.startsWith('/interfluent.ai');
    const base = isProjectPages ? '/interfluent.ai/' : '/';
    const r = {
      home: base, product: base + '#codelens', pricing: base + 'pricing/',
      about: base + 'about/', blog: base + 'blog/', careers: base + 'careers/',
      contact: base + 'contact/', signin: base + 'signin/', beta: base + 'beta/',
      logo: base + 'assets/images/interfluent-logo.svg',
      faviconLight: base + 'assets/images/favicon-light.png',
      faviconDark: base + 'assets/images/favicon-dark.png',
      webclip: base + 'assets/images/webclip.png'
    };
    const c = {}; ['pricing','about','blog','careers','contact'].forEach(k => c[k] = k === active ? 'var(--color-text)' : 'var(--color-text-soft)');
    return { c, r, showBeta: !!beta, showWalk: !beta, showSignIn: !!code };
  }
}
</script>
</body>
</html>
