<!DOCTYPE html>
<html data-seo-page="contact">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="assets/images/favicon-light.png">
<link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="assets/images/favicon-dark.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/webclip.png">
<script data-site-base>document.write('<base href="'+(location.hostname.endsWith('.github.io')?'/interfluent.ai/':'/')+'">')</script>
<script src="assets/js/seo-config.js"></script>
<script src="assets/js/seo.js"></script>
<script src="support.js"></script>
</head>
<body>
<x-dc class="page-wrapper">
<helmet>
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/global.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages/contact.css">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<script src="site-config.js"></script>
<style>body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}a{color:var(--color-primary);text-decoration:none}a:hover{color:var(--color-primary-hover)}*{box-sizing:border-box}input,select,textarea{font:inherit;color:inherit}</style>
</helmet>
<dc-import name="SiteNav" active="contact" hint-size="100%,64px" class="contact_contact_dc-import"></dc-import>
<main class="main-wrapper">

<section data-screen-label="Contact" class="contact_contact_section is-first-section">
  <div>
    <div class="contact_contact_div">CONTACT</div>
    <h1 class="contact_contact_h1">Book a walkthrough on your own codebase.</h1>
    <p class="contact_contact_p">Forty-five minutes, live, from feature map to test plan. Bring the change you can't price and we'll price it in front of you.</p>
    <div class="contact_contact_div-2">
      <div><div class="contact_contact_div-3">EMAIL</div><a href="mailto:hello@codelens.ai" class="contact_contact_a">hello@codelens.ai</a></div>
      <div><div class="contact_contact_div-4">RESPONSE TIME</div>Within two working days</div>
    </div>
  </div>

  <div class="contact_contact_div-5">
    <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
      <form onSubmit="{{ submit }}" class="contact_contact_form">
        <div class="contact_contact_div-6">
          <label class="contact_contact_label"><span>Name</span><input required="{{ true }}" placeholder="Asha Rao" style-focus="border-color:var(--color-primary)" class="contact_contact_input"></label>
          <label class="contact_contact_label-2"><span>Work email</span><input type="email" required="{{ true }}" placeholder="asha@company.com" style-focus="border-color:var(--color-primary)" class="contact_contact_input-2"></label>
        </div>
        <label class="contact_contact_label-3"><span>I want to</span><select class="contact_contact_select"><option>Book a walkthrough</option><option>Ask about pricing</option><option>Talk about a role</option><option>Something else</option></select></label>
        <label class="contact_contact_label-4"><span>Message</span><textarea rows="{{ 5 }}" placeholder="Tell us about the system and the change you have in mind." style-focus="border-color:var(--color-primary)" class="contact_contact_textarea"></textarea></label>
        <button type="submit" style-hover="background:var(--color-primary-hover)" class="contact_contact_button">Send</button>
      </form>
    </sc-if>
    <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
      <div class="contact_contact_div-7">
        <div class="contact_contact_div-8">✓</div>
        <div class="contact_contact_div-9">Sent.</div>
        <div class="contact_contact_div-10">A person will reply within two working days.</div>
      </div>
    </sc-if>
  </div>
</section>

</main>
<dc-import name="SiteFooter" hint-size="100%,320px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { sent: false };
  renderVals() { return { sent: this.state.sent, notSent: !this.state.sent, submit: e => { e.preventDefault(); this.setState({ sent: true }); } }; }
}
</script>
</body>
</html>
