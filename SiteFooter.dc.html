<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:#1f4e3d;text-decoration:none}a:hover{color:#153628}*{box-sizing:border-box}</style>
</helmet>
<div style="max-width:1240px;margin:0 auto;padding:0 40px 40px;font-family:Figtree,system-ui,sans-serif">
  <footer class="rs-footgrid" style="display:grid;grid-template-columns:minmax(200px,1.4fr) repeat(auto-fit,minmax(min(140px,100%),1fr));gap:32px;padding:64px 8px 0;border-top:1px solid rgba(30,28,25,.08);font-size:14px;color:#514c44">
    <div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><div style="width:22px;height:22px;border-radius:7px;background:#1f4e3d;position:relative"><div style="position:absolute;inset:6px;border-radius:50%;border:2px solid #e0a458"></div></div><span style="font-weight:700;font-size:16px;color:#1e1c19">CodeLens</span></div>
      <div style="max-width:300px;line-height:1.55;text-wrap:pretty">The shared context layer where business and engineering read the same system.</div>
      <div style="margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8a847a">A1004, Amar Business Park, Baner, Pune 411045</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px"><div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#8a847a;margin-bottom:4px">PRODUCT</div><a href="{{ r.product }}" style="color:#514c44">Feature map</a><a href="{{ r.product }}" style="color:#514c44">Impact analysis</a><a href="{{ r.pricing }}" style="color:#514c44">Pricing</a><sc-if value="{{ showBeta }}" hint-placeholder-val="{{ true }}"><a href="{{ r.beta }}" style="color:#514c44">Beta access</a></sc-if></div>
    <div style="display:flex;flex-direction:column;gap:10px"><div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#8a847a;margin-bottom:4px">COMPANY</div><a href="{{ r.about }}" style="color:#514c44">About us</a><a href="{{ r.careers }}" style="color:#514c44">Careers</a><a href="{{ r.contact }}" style="color:#514c44">Contact</a></div>
    <div style="display:flex;flex-direction:column;gap:10px"><div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#8a847a;margin-bottom:4px">RESOURCES</div><a href="{{ r.blog }}" style="color:#514c44">Blog</a><a href="{{ r.contact }}" style="color:#514c44">Book a walkthrough</a><sc-if value="{{ showSignIn }}" hint-placeholder-val="{{ true }}"><a href="{{ r.signin }}" style="color:#514c44">Sign in</a></sc-if></div>
  </footer>
  <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:40px 8px 0;font-size:13px;color:#8a847a"><span>© 2026 CodeLens</span><span style="display:flex;gap:18px"><a href="{{ r.privacy }}" style="color:#8a847a">Privacy</a><a href="{{ r.terms }}" style="color:#8a847a">Terms</a></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:320},&quot;betaEnabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;accessCodeEnabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const cfg = window.CODELENS_CONFIG || {};
    const isProjectPages = location.hostname.endsWith('github.io') && location.pathname.startsWith('/interfluent.ai');
    const base = isProjectPages ? '/interfluent.ai/' : '/';
    const r = {
      product: base + '#codelens', pricing: base + 'pricing/', beta: base + 'beta/',
      about: base + 'about/', careers: base + 'careers/', contact: base + 'contact/',
      blog: base + 'blog/', signin: base + 'signin/', privacy: base + 'privacy/', terms: base + 'terms/'
    };
    return { r, showBeta: !!(this.props.betaEnabled ?? cfg.betaEnabled ?? true), showSignIn: !!(this.props.accessCodeEnabled ?? cfg.accessCodeEnabled ?? true) };
  }
}
</script>
</body>
</html>
