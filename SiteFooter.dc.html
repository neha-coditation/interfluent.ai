<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<x-dc>
  
<helmet>
<link rel="stylesheet" href="assets/css/global.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages/site-footer.css">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:var(--font-sans);-webkit-font-smoothing:antialiased}a{color:var(--color-primary);text-decoration:none}a:hover{color:var(--color-primary-hover)}*{box-sizing:border-box}</style>
</helmet>
<div class="site-footer_site-footer_div">
  <footer class="rs-footgrid site-footer_site-footer_footer">
    <div>
      <div class="site-footer_site-footer_div-2"><a href="{{ r.home }}" aria-label="Interfluent home"><img src="{{ r.logo }}" alt="Interfluent" class="site-footer_site-footer_img"></a></div>
      <div class="site-footer_site-footer_div-3">The shared context layer where business and engineering read the same system.</div>
      <div class="site-footer_site-footer_div-4">A1004, Amar Business Park, Baner, Pune 411045</div>
    </div>
    <div class="site-footer_site-footer_div-5"><div class="site-footer_site-footer_div-6">PRODUCT</div><a href="{{ r.product }}" class="site-footer_site-footer_a">Feature map</a><a href="{{ r.product }}" class="site-footer_site-footer_a-2">Impact analysis</a><a href="{{ r.pricing }}" class="site-footer_site-footer_a-3">Pricing</a><sc-if value="{{ showBeta }}" hint-placeholder-val="{{ true }}"><a href="{{ r.beta }}" class="site-footer_site-footer_a-4">Beta access</a></sc-if></div>
    <div class="site-footer_site-footer_div-7"><div class="site-footer_site-footer_div-8">COMPANY</div><a href="{{ r.about }}" class="site-footer_site-footer_a-5">About us</a><a href="{{ r.careers }}" class="site-footer_site-footer_a-6">Careers</a><a href="{{ r.contact }}" class="site-footer_site-footer_a-7">Contact</a></div>
    <div class="site-footer_site-footer_div-9"><div class="site-footer_site-footer_div-10">RESOURCES</div><a href="{{ r.blog }}" class="site-footer_site-footer_a-8">Blog</a><a href="{{ r.contact }}" class="site-footer_site-footer_a-9">Book a walkthrough</a><sc-if value="{{ showSignIn }}" hint-placeholder-val="{{ true }}"><a href="{{ r.signin }}" class="site-footer_site-footer_a-10">Sign in</a></sc-if></div>
  </footer>
  <div class="site-footer_site-footer_div-11"><span>© 2026 Interfluent</span><span class="site-footer_site-footer_span"><a href="{{ r.privacy }}" class="site-footer_site-footer_a-11">Privacy</a><a href="{{ r.terms }}" class="site-footer_site-footer_a-12">Terms</a></span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:320},&quot;betaEnabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;accessCodeEnabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const cfg = window.CODELENS_CONFIG || {};
    const isProjectPages = location.hostname.endsWith('github.io') && location.pathname.startsWith('/interfluent.ai');
    const base = isProjectPages ? '/interfluent.ai/' : '/';
    const r = {
      product: base + '#codelens', pricing: base + 'pricing/', beta: base + 'beta/',
      about: base + 'about/', careers: base + 'careers/', contact: base + 'contact/',
      home: base, blog: base + 'blog/', signin: base + 'signin/', privacy: base + 'privacy/', terms: base + 'terms/',
      logo: base + 'assets/images/interfluent-logo.svg'
    };
    return { r, showBeta: !!(this.props.betaEnabled ?? cfg.betaEnabled ?? true), showSignIn: !!(this.props.accessCodeEnabled ?? cfg.accessCodeEnabled ?? true) };
  }
}
</script>
</body>
</html>
